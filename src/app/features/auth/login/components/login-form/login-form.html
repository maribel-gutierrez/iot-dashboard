<form
  (submit)="onSubmit($event)"
  autocomplete="off"
  class="mx-auto mt-6 max-w-md rounded-2xl border border-white/5 bg-linear-to-br from-slate-800/80 to-slate-900/80 p-6 shadow-lg backdrop-blur-sm"
>
  <div class="space-y-6">
    <header class="mb-1">
      <h1 class="text-2xl font-extrabold text-white">Welcome back</h1>
      <p class="mt-1 text-sm text-slate-300">
        Monitor and control your IoT devices — sign in to continue.
      </p>
    </header>

    <div>
      <div class="flex flex-col gap-5">
        <div>
          <label for="email" class="block text-sm font-medium text-slate-200">Email</label>
          <div class="mt-2">
            <input
              id="email"
              type="email"
              placeholder="you@example.com"
              class="w-full rounded-lg border border-white/6 bg-white/5 px-3 py-2 text-sm text-white transition-shadow placeholder:text-slate-400 focus:border-transparent focus:ring-2 focus:ring-indigo-500"
              [formField]="loginForm.email"
            />
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-200">Password</label>
          <div class="mt-2">
            <input
              id="password"
              type="password"
              placeholder="••••••••"
              class="w-full rounded-lg border border-white/6 bg-white/5 px-3 py-2 text-sm text-white transition-shadow placeholder:text-slate-400 focus:border-transparent focus:ring-2 focus:ring-indigo-500"
              [formField]="loginForm.password"
            />
          </div>
          <div class="mt-2 flex items-center justify-between text-xs">
            <a class="text-indigo-400 hover:underline" href="#">Forgot password?</a>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-4">
      <button
        type="submit"
        [disabled]="loading()"
        class="inline-flex w-full cursor-pointer items-center justify-center gap-2 rounded-lg bg-linear-to-r from-indigo-500 to-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-md transition-transform hover:scale-[1.01] active:scale-[0.995] disabled:cursor-not-allowed disabled:opacity-50"
      >
        {{ loading() ? 'Loading...' : 'Sign in' }}
      </button>
    </div>
  </div>
</form>
