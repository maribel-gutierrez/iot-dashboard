@if (isError()) {
  <alert-message [message]="message()"/>
}

<div class="min-h-[60vh] flex items-center justify-center p-6">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start max-w-4xl w-full">
    <div class="order-2 md:order-1 flex items-center justify-center">
      <role-card-grid [loading]="isDemoLoading()" (loginAsDemo)="loginAs($event)"/>
    </div>

    <div class="order-1 md:order-2 flex items-center justify-center">
      <login-form [loading]="isFormLoading()" (login)="login($event)"/>
    </div>
  </div>
</div>
