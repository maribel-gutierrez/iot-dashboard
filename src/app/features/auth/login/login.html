@if (isError()) {
  <alert-message [message]="message()"/>
}

<div class="flex flex-row items-center justify-center gap-10">
  <div>
    <h2 class="text-white">Explore Now</h2>
    <p>No account needed — try a demo role</p>
    <div class="grid grid-cols-2 gap-3 text-white">
      <div class="bg-neutral-primary-soft block max-w-sm p-6 border border-default rounded-base shadow-xs">
        <h3 class="mb-3 text-2xl font-semibold tracking-tight text-heading leading-8">Full control</h3>
        <ul>
          <li>View all devices</li>
          <li>Send commands</li>
          <li>Set Alerts</li>
          <li>Full analytics</li>
        </ul>
        <a href="#"
           (click)="loginAs($event,RolesEnum.Admin)"
           class="inline-flex items-center text-white bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none">
          Try Admin
          <svg class="w-4 h-4 ms-1.5 rtl:rotate-180 -me-0.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
               width="24" height="24" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M19 12H5m14 0-4 4m4-4-4-4"/>
          </svg>
        </a>
      </div>
      <div>
        <h3>Read Only</h3>
        <ul>
          <li>Monitor devices</li>
          <li>View telemetry</li>
          <li>View analytics</li>
          <li>No controls</li>
        </ul>
        <a href="#"
           (click)="loginAs($event,RolesEnum.Viewer)"
           class="inline-flex items-center text-white bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none">
          Try Viewer
          <svg class="w-4 h-4 ms-1.5 rtl:rotate-180 -me-0.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
               width="24" height="24" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M19 12H5m14 0-4 4m4-4-4-4"/>
          </svg>
        </a>
      </div>
    </div>
  </div>
  <login-form (login)="onLogin($event)"/>
</div>
