<form (submit)="onSubmit($event)" autocomplete="off" class="justify-center mx-auto mt-5 max-w-lg">
	<div class="space-y-12">
		<h1 class="text-base/7 font-semibold text-white">Login</h1>
		<p class="bg-amber-200">Monitor and control your IoT devices</p>
		<div>
			<div class="flex flex-col gap-6">
				<div>
					<label for="email" class="block text-sm/6 font-medium text-white">Email</label>
					<div class="mt-2">
						<div
								class="flex items-center rounded-md bg-white/5 pl-3 outline-1 -outline-offset-1 outline-white/10 focus-within:outline-2 focus-within:-outline-offset-2 focus-within:outline-indigo-500">
							<input id="email" type="email" placeholder="example@gmail.com"
							       class="block min-w-0 grow bg-transparent py-1.5 pr-3 pl-1 text-base text-white placeholder:text-gray-500 focus:outline-none sm:text-sm/6"
							       [formField]="loginForm.email"/>
						</div>
					</div>
				</div>
				<div>
					<label for="password" class="block text-sm/6 font-medium text-white">Password</label>
					<div class="mt-2">
						<div
								class="flex items-center rounded-md bg-white/5 pl-3 outline-1 -outline-offset-1 outline-white/10 focus-within:outline-2 focus-within:-outline-offset-2 focus-within:outline-indigo-500">
							<input id="password" type="password" placeholder="janesmith"
							       class="block min-w-0 grow bg-transparent py-1.5 pr-3 pl-1 text-base text-white placeholder:text-gray-500 focus:outline-none sm:text-sm/6"
							       [formField]="loginForm.password"/>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div class="flex justify-end">
			<button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Submit
			</button>
		</div>
	</div>
</form>
