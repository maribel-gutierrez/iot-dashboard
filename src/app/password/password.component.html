<div class="min-h-screen bg-slate-950 flex items-center justify-center px-6">
  <div
    class="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900/80 backdrop-blur-lg p-8 shadow-2xl"
  >
    <div class="flex justify-center mb-6">
      <div
        class="h-16 w-16 rounded-full bg-cyan-500/10 flex items-center justify-center"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-8 w-8 text-cyan-400"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 15v2m-6-6V9a6 6 0 1112 0v2m-9 0h6a2 2 0 012 2v4a2 2 0 01-2 2H9a2 2 0 01-2-2v-4a2 2 0 012-2z"
          />
        </svg>
      </div>
    </div>

    <h1 class="text-2xl font-bold text-center text-white mb-2">
      Project Access
    </h1>

    <p class="text-slate-400 text-center mb-8">
      This project is currently under development.
      Enter the password to continue.
    </p>

    <form class="space-y-4">
      <div>
        <label
          for="password"
          class="block text-sm font-medium text-slate-300 mb-2"
        >
          Password
        </label>

        <input
          id="password"
          type="password"
          placeholder="Enter password"
          class="w-full rounded-xl border border-slate-700 bg-slate-800 px-4 py-3 text-white placeholder-slate-500 outline-none transition focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20"
          #passwordInput
        />
      </div>

      <button
        type="submit"
        class="w-full rounded-xl bg-cyan-500 px-4 py-3 font-semibold text-slate-950 transition hover:bg-cyan-400 active:scale-[0.98]"
        (click)="checkPassword($event, passwordInput.value)"
      >
        Enter Project
      </button>
    </form>

    <div class="mt-8 border-t border-slate-800 pt-6">
      <p class="text-center text-xs text-slate-500">
        maribel-gutierrez.dev
      </p>
    </div>
  </div>
</div>
